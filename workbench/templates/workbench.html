<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiteCool S1 — 工程工作台</title>
<style>
  :root {
    --bg:#f5f5f3; --card:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --faint:#9a9aa0;
    --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.13);
    --ok:#3a9a6d; --ok-bg:#e9f4ee; --ok-ink:#2c7250;
    --warn:#ad8434; --warn-bg:#f7f0de; --warn-ink:#7a5c1f;
    --risk:#c05b56; --risk-bg:#f9ecea; --risk-ink:#8f3d38;
    --todo:#8e8e93; --todo-bg:#f0f0ee; --todo-ink:#6e6e73;
    --link:#0b6e63;
    --r-card:14px;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.03);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-font-smoothing:antialiased; }
  body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--ink); font-size:13px; }

  /* ── 顶栏 ─────────────────────────────── */
  header { display:flex; align-items:center; gap:16px; padding:8px 28px;
           background:rgba(245,245,243,.82); backdrop-filter:saturate(1.6) blur(14px); -webkit-backdrop-filter:saturate(1.6) blur(14px);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  header h1 { font-size:15px; font-weight:650; letter-spacing:.01em; white-space:nowrap; }
  header .meta { font-size:11px; color:var(--faint); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  nav { display:flex; gap:2px; margin-left:auto; background:rgba(0,0,0,.055); border-radius:11px; padding:2px; }
  nav button { border:0; background:transparent; border-radius:9px; padding:5px 13px; font-size:12px; cursor:pointer;
               color:var(--muted); font-weight:500; transition:background .15s,color .15s; white-space:nowrap; }
  nav button:hover { color:var(--ink); }
  nav button.active { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04); }
  main { padding:14px 28px 48px; max-width:1560px; margin:0 auto; }
  .pane { display:none; }
  .pane.active { display:block; animation:fade .25s ease; }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:14px 16px; box-shadow:var(--shadow); }

  .badge { display:inline-block; font-size:11px; font-weight:500; padding:2px 9px; border-radius:999px; white-space:nowrap; letter-spacing:.01em; }
  .b-ok { background:var(--ok-bg); color:var(--ok-ink); }
  .b-warn { background:var(--warn-bg); color:var(--warn-ink); }
  .b-risk { background:var(--risk-bg); color:var(--risk-ink); }
  .b-todo { background:var(--todo-bg); color:var(--todo-ink); }

  .banner { border-radius:12px; padding:9px 14px; font-size:12.5px; margin-bottom:12px; line-height:1.6; border:1px solid; }
  .banner.warn { background:var(--warn-bg); color:var(--warn-ink); border-color:rgba(173,132,52,.28); }
  .banner.risk { background:var(--risk-bg); color:var(--risk-ink); border-color:rgba(192,91,86,.28); }
  .banner.ok { background:var(--ok-bg); color:var(--ok-ink); border-color:rgba(58,154,109,.28); }

  table { border-collapse:collapse; width:100%; font-size:12.5px; background:var(--card); border-radius:12px; overflow:hidden; }
  th, td { padding:8px 12px; text-align:left; vertical-align:top; line-height:1.6; border-bottom:1px solid var(--line); }
  thead th { font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.04em; background:rgba(0,0,0,.025); border-bottom:1px solid var(--line2); }
  tbody th { font-weight:600; white-space:nowrap; background:rgba(0,0,0,.02); }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom:0; }
  a { color:var(--link); text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* ① 流水线总览 */
  .stage-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; }
  .stage { border-left:3px solid var(--todo); }
  .stage.done { border-left-color:var(--ok); }
  .stage.doing { border-left-color:var(--warn); }
  .stage.blocked { border-left-color:var(--risk); }
  .stage h3 { font-size:13.5px; font-weight:650; margin-bottom:4px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .stage .gate { font-size:11.5px; color:var(--muted); margin:5px 0; line-height:1.55; }
  .stage .art { font-size:11.5px; margin:2px 0; color:var(--muted); }
  .stage .note { font-size:11.5px; margin-top:6px; line-height:1.6; color:var(--ink); }
  .blocker-row { display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; }
  .blocker { flex:1; min-width:260px; border:1px solid rgba(192,91,86,.3); background:#fff; border-radius:var(--r-card); padding:12px 15px; font-size:12.5px; line-height:1.7; box-shadow:var(--shadow); }
  .blocker h4 { font-size:13px; color:var(--risk-ink); margin-bottom:4px; }

  /* ② 竞品分析 */
  .comp-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .comp { display:flex; flex-direction:column; gap:7px; font-size:12.5px; }
  .comp h3 { font-size:13.5px; font-weight:650; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .comp img { width:100%; height:180px; object-fit:contain; background:#fafafa; border:1px solid var(--line); border-radius:10px; }
  .comp .price { font-size:16px; font-weight:700; letter-spacing:-.01em; }
  .comp .fn { color:var(--muted); line-height:1.6; white-space:pre-line; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { font-size:11px; background:rgba(0,0,0,.045); color:var(--todo-ink); border-radius:999px; padding:2px 9px; }
  .chip.claim { background:var(--warn-bg); color:var(--warn-ink); }
  .revs { font-size:11.5px; line-height:1.65; }
  .revs .good { color:var(--ok-ink); }
  .revs .bad { color:var(--risk-ink); }
  .revs details { margin-top:3px; }
  .revs summary { cursor:pointer; color:var(--muted); font-weight:500; }
  .comp.placeholder { background:var(--todo-bg); border-style:dashed; color:var(--todo-ink); box-shadow:none; }
  .comp.placeholder .missing { font-size:11.5px; background:#fff; border:1px dashed var(--todo); border-radius:10px; padding:8px 11px; line-height:1.65; }

  /* ③ 形态对比 —— 产品画廊 */
  .forms-main { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
  .forms-sub { font-size:11.5px; font-weight:600; color:var(--faint); letter-spacing:.08em; margin:14px 2px 8px; }
  .forms-explore { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
  .form-card { display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line);
               border-radius:16px; overflow:hidden; box-shadow:var(--shadow); }
  .form-media { position:relative; aspect-ratio:3/2; background:#ebebe8; overflow:hidden; flex:none; }
  .m-item { position:absolute; inset:0; width:100%; height:100%; }
  img.m-item[data-g="concept"] { object-fit:cover; }
  img.m-item[data-g="render"] { object-fit:contain; background:#f3f3f1; }
  .m-item[hidden] { display:none; }
  .form-media .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
                    color:var(--faint); font-size:12px; line-height:1.8; padding:12px; }
  .media-ctl { position:absolute; left:0; right:0; bottom:10px; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; }
  .media-groups, .media-subs { display:flex; gap:2px; pointer-events:auto; padding:2px; border-radius:999px;
                               background:rgba(255,255,255,.85); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
                               box-shadow:0 1px 5px rgba(0,0,0,.14); }
  .media-groups button { border:0; background:transparent; font-size:11px; font-weight:500; padding:3px 11px; border-radius:999px;
                         cursor:pointer; color:var(--muted); transition:background .15s,color .15s; }
  .media-groups button.active { background:var(--ink); color:#fff; }
  .media-groups button:disabled { color:var(--faint); cursor:not-allowed; }
  .media-subs button { border:0; background:transparent; font-size:10px; min-width:20px; height:20px; padding:0 6px; border-radius:999px;
                       cursor:pointer; color:var(--muted); transition:background .15s,color .15s; }
  .media-subs button.active { background:var(--ink); color:#fff; }
  .media-subs[hidden] { display:none; }
  .form-body { padding:12px 16px 10px; display:flex; flex-direction:column; gap:7px; flex:1; }
  .form-head { display:flex; align-items:center; gap:8px; }
  .form-id { font-size:15px; font-weight:700; letter-spacing:-.01em; }
  .form-name { font-size:12.5px; color:var(--muted); }
  .form-head .badge { margin-left:auto; }
  .form-claim { font-size:14px; font-weight:600; line-height:1.5; letter-spacing:-.005em; }
  .form-lang { font-size:11.5px; color:var(--muted); line-height:1.6;
               display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .score-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:5px 12px; border-top:1px solid var(--line); padding-top:9px; }
  .score { display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:10.5px; color:var(--muted); cursor:default; }
  .stars { white-space:nowrap; font-size:11px; letter-spacing:.5px; }
  .stars .on { color:var(--ok); }
  .stars .mid { color:var(--warn); }
  .stars .off2 { color:var(--risk); }
  .stars .off { color:rgba(0,0,0,.14); }
  .form-tags { display:flex; gap:6px; flex-wrap:wrap; }
  .form-notes { font-size:11.5px; color:var(--muted); line-height:1.65; }
  .form-notes summary { cursor:pointer; color:var(--faint); font-size:11px; font-weight:500; list-style:none; }
  .form-notes summary::before { content:"▸ "; }
  .form-notes[open] summary::before { content:"▾ "; }
  .form-notes summary:hover { color:var(--muted); }
  .form-notes > div { margin-top:6px; }
  /* 探索向：横向小卡 */
  .form-card.explore { flex-direction:row; }
  .form-card.explore .form-media { width:200px; aspect-ratio:auto; align-self:stretch; }
  .form-card.explore .form-claim { font-size:13px; }
  .form-card.explore .score-grid { grid-template-columns:repeat(3,1fr); }
  .q1-banner { margin-top:16px; }
  .glb-view { width:100%; height:100%; }

  /* ④ 3D 拆分 + 供应链 —— 装配体查看器 */
  .asm { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:14px; margin-bottom:16px; }
  .asm-stage { padding:0; overflow:hidden; display:flex; flex-direction:column; }
  .asm-view { width:100%; height:520px; background:#f3f3f1; touch-action:none; position:relative; }
  .asm-view .asm-labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .asm-mode { border:1px solid var(--line2); background:#fff; border-radius:999px; font-size:11px; font-weight:600;
              padding:3px 12px; cursor:pointer; color:var(--muted); transition:background .15s,color .15s; white-space:nowrap; }
  .asm-mode:hover { color:var(--ink); }
  .asm-mode.active { background:var(--ink); border-color:var(--ink); color:#fff; }
  .asm-label { display:flex; align-items:center; gap:5px; background:rgba(255,255,255,.92); border:1px solid rgba(0,0,0,.14);
               border-radius:999px; padding:2px 9px 2px 6px; font-size:11px; font-weight:600; color:var(--ink);
               white-space:nowrap; box-shadow:0 1px 4px rgba(0,0,0,.12); pointer-events:none;
               font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif; }
  .asm-label .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .asm-bar { display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--line); }
  .asm-bar input[type=range] { flex:1; accent-color:var(--link); height:4px; }
  .asm-bar-label { font-size:11px; color:var(--muted); font-weight:600; white-space:nowrap; }
  .asm-hint { font-size:10.5px; color:var(--faint); margin-left:auto; white-space:nowrap; }
  .asm-side { display:flex; flex-direction:column; gap:12px; min-height:0; }
  .asm-parts { flex:1; overflow:auto; max-height:560px; padding:12px 14px; }
  .asm-parts h3 { font-size:12.5px; font-weight:650; margin-bottom:6px; }
  .asm-mod { font-size:11px; font-weight:700; color:var(--muted); margin:9px 0 3px; letter-spacing:.03em; }
  .asm-part { display:block; width:100%; text-align:left; border:0; background:transparent; font-size:12px;
              padding:3px 8px; border-radius:7px; cursor:pointer; color:var(--ink); line-height:1.5; }
  .asm-part:hover { background:rgba(0,0,0,.05); }
  .asm-part.active { background:var(--link); color:#fff; }
  .asm-part .pn { color:var(--faint); font-size:10px; margin-left:5px; font-family:ui-monospace,monospace; }
  .asm-part.active .pn { color:rgba(255,255,255,.75); }
  .asm-bom { font-size:12px; line-height:1.7; padding:12px 14px; }
  .asm-bom h3 { font-size:13px; font-weight:650; margin-bottom:4px; }
  .asm-bom .fn { color:var(--muted); font-size:11.5px; margin-bottom:6px; }
  .asm-bom .cand { border-top:1px solid var(--line); padding:6px 0; }
  .asm-bom .cand .meta { color:var(--muted); font-size:11px; }
  .asm-bom .budget { margin-top:6px; font-size:11.5px; color:var(--warn-ink); background:var(--warn-bg); border-radius:8px; padding:5px 9px; }
  .asm-form-bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .asm-form-btn { border:1px solid var(--line2); background:#fff; border-radius:999px; font-size:12px; font-weight:600;
                  padding:5px 16px; cursor:pointer; color:var(--muted); transition:background .15s,color .15s; }
  .asm-form-btn:hover { color:var(--ink); }
  .asm-form-btn.active { background:var(--ink); border-color:var(--ink); color:#fff; }
  .asm-form-btn .cnt { font-weight:400; opacity:.65; margin-left:3px; font-size:11px; }
  .asm-info { margin:10px 0 16px; }
  .asm-info a { display:inline-flex; align-items:center; gap:12px; text-decoration:none; color:var(--muted); font-size:11.5px; font-weight:600; }
  .asm-info a:hover { color:var(--link); }
  .asm-info img { width:110px; border:1px solid var(--line); border-radius:8px; background:#f4f5f7; }

  /* ④⑤ 空架子 */
  .shelf { border:1.5px dashed var(--todo); border-radius:16px; padding:28px; text-align:center; color:var(--muted);
           font-size:12.5px; line-height:1.85; background:rgba(255,255,255,.5); margin-bottom:16px; }
  .shelf b { color:var(--ink); }

  /* ⑥ 需求与决策 */
  .req-sec { margin-bottom:22px; }
  .req-sec h3 { font-size:13.5px; font-weight:650; margin-bottom:8px; }
  .timeline { border-left:2px solid var(--line2); margin-left:8px; padding-left:18px; }
  .tl-item { position:relative; margin-bottom:16px; font-size:12.5px; line-height:1.7; }
  .tl-item::before { content:""; position:absolute; left:-23.5px; top:6px; width:9px; height:9px; border-radius:50%;
                     background:var(--warn); box-shadow:0 0 0 3px var(--bg); }
  .tl-item .q { color:var(--muted); font-size:12px; }
  .foot { margin-top:18px; font-size:11px; color:var(--faint); line-height:1.75; }
</style>

<body>
<header>
  <h1>LiteCool S1 · 工程工作台</h1>
  <span class="meta">生成于 __GENERATED_AT__ · 数据源 data/ + research/ · 颜色纪律 <span class="badge b-ok">绿=已核验</span> <span class="badge b-warn">黄=候选/待补</span> <span class="badge b-risk">红=风险/阻塞</span></span>
  <nav id="tabs">
    <button data-tab="overview" class="active">① 流水线总览</button>
    <button data-tab="competitors">② 竞品分析</button>
    <button data-tab="forms">③ 形态对比</button>
    <button data-tab="supply">④ 3D拆分+供应链</button>
    <button data-tab="patent">⑤ 专利规避</button>
    <button data-tab="requirements">⑥ 需求与决策</button>
  </nav>
</header>
<main>
  <section class="pane active" id="pane-overview">__TAB_OVERVIEW__</section>
  <section class="pane" id="pane-competitors">__TAB_COMPETITORS__</section>
  <section class="pane" id="pane-forms">__TAB_FORMS__</section>
  <section class="pane" id="pane-supply">__TAB_SUPPLY__</section>
  <section class="pane" id="pane-patent">__TAB_PATENT__</section>
  <section class="pane" id="pane-requirements">__TAB_REQUIREMENTS__</section>
</main>
<script>
// Tab 切换
document.querySelectorAll('#tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + btn.dataset.tab));
    if (btn.dataset.tab === 'supply' && window.__initAsm) window.__initAsm();
  });
});
// 形态画廊：组切换（概念图/白模视图/3D）+ 组内子项切换
document.querySelectorAll('.form-media').forEach(media => {
  const items = [...media.querySelectorAll('.m-item')];
  const groups = [...media.querySelectorAll('.media-groups button[data-g]')];
  const subs = [...media.querySelectorAll('.media-subs')];
  function showGroup(g, idx) {
    idx = idx || 0;
    groups.forEach(b => b.classList.toggle('active', b.dataset.g === g));
    subs.forEach(s => { s.hidden = s.dataset.g !== g; });
    const inGroup = items.filter(el => el.dataset.g === g);
    items.forEach(el => { el.hidden = true; });
    if (inGroup[idx]) inGroup[idx].hidden = false;
    subs.filter(s => s.dataset.g === g).forEach(s =>
      [...s.querySelectorAll('button')].forEach((b, i) => b.classList.toggle('active', i === idx)));
    const cur = inGroup[idx];
    if (cur && cur.classList.contains('glb-view') && window.__initGlb) window.__initGlb(cur);
  }
  media.addEventListener('click', e => {
    const gb = e.target.closest('.media-groups button[data-g]');
    if (gb && !gb.disabled) { showGroup(gb.dataset.g, 0); return; }
    const sb = e.target.closest('.media-subs button');
    if (sb) { showGroup(sb.closest('.media-subs').dataset.g, +sb.dataset.i); }
  });
});
</script>
<script type="module">
// GLB 查看器：懒初始化——首次切到 3D 层时才建 scene（元素 hidden 时 clientWidth=0）
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

function initViewer(el) {
  if (el.dataset.inited) return;
  el.dataset.inited = '1';
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf3f3f1);
  const camera = new THREE.PerspectiveCamera(40, el.clientWidth / el.clientHeight, 0.01, 50);
  camera.position.set(1.05, 0.85, 1.45);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(el.clientWidth, el.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  el.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xdfe3e8, 1.6));
  const key = new THREE.DirectionalLight(0xffffff, 1.8);
  key.position.set(2, 3, 2);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.7);
  fill.position.set(-1.5, 0.5, -1);
  scene.add(fill);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  new GLTFLoader().load(el.dataset.glb, gltf => {
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const k = 1.0 / Math.max(size.x, size.y, size.z);
    model.scale.setScalar(k);
    model.position.sub(center.multiplyScalar(k));
    scene.add(model);
  }, undefined, err => {
    el.innerHTML = '<div class="ph">GLB 加载失败：' + err + '</div>';
  });
  (function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
}
window.__initGlb = initViewer;
// 默认就在 3D 层的（无概念图/渲染图时）
document.querySelectorAll('.glb-view[data-glb]:not([hidden])').forEach(el => {
  if (el.offsetParent !== null) initViewer(el);
});

// ── ④ 装配体查看器：爆炸滑块 + 零件高亮 + BOM 卡 ──────────────────
function escHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function initAssembly(root) {
  if (root.dataset.inited) return;
  const view = root.querySelector('.asm-view');
  if (!view || view.clientWidth === 0) return;
  const partsMeta = {};
  const partsJson = JSON.parse(root.querySelector('.asm-data[data-kind="parts"]').textContent);
  partsJson.parts.forEach(p => { partsMeta[p.name] = p; });
  const bomModules = {};
  JSON.parse(root.querySelector('.asm-data[data-kind="bom"]').textContent).modules
    .forEach(m => { bomModules[m.id] = m; });
  root.dataset.inited = '1';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf3f3f1);
  const camera = new THREE.PerspectiveCamera(40, view.clientWidth / view.clientHeight, 0.01, 50);
  camera.position.set(1.15, 0.95, 1.60);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(view.clientWidth, view.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  view.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xdfe3e8, 1.6));
  const key = new THREE.DirectionalLight(0xffffff, 1.8); key.position.set(2, 3, 2); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.7); fill.position.set(-1.5, 0.5, -1); scene.add(fill);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // ── 爆炸标注层（CSS2D）：关键零件中文标签，随爆炸滑块显隐 ──
  const labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(view.clientWidth, view.clientHeight);
  labelRenderer.domElement.className = 'asm-labels';
  view.appendChild(labelRenderer.domElement);
  // 关键零件中文标注清单：数据源 labels.json（build.py 注入 blob），缺省回退形态 A
  const KEY_LABELS = partsJson.key_labels || ['Body', 'Base', 'M1_Bosses', 'M2_Cell_B', 'M3_PCB', 'M4_FanFrame',
    'M5_TEC', 'M5_ColdFins', 'M5_HotSink', 'M5_Separator', 'M5_EVA', 'M1_Stepper',
    'M1_Pinion', 'Louver_1', 'M6_TwistLock', 'M7_Module'];
  const MOD_COLORS = { M1: '#a0855b', M2: '#2e7dbf', M3: '#3a9a6d', M4: '#5b6470',
    M5: '#c05b56', M6: '#c9a227', M7: '#7b5ea7', M8: '#8e8e93' };
  let xrayOn = false, labelsOn = true, explodeT = 0;
  // 透视模式的外壳类零件：M6 模块（壳体/前壳/腰线/旋扣/导风板）+ Base（对标参考-3 透壳）
  const isGhost = name => (partsMeta[name] || {}).module === 'M6' || name === 'Base';
  function updateLabels() {
    const show = labelsOn && explodeT > 0.3;
    parts.forEach(p => { if (p.labelObj) p.labelObj.visible = show; });
  }

  const parts = [];   // {name, obj, base, explode}
  const byName = {};
  new GLTFLoader().load(view.dataset.glb, gltf => {
    const model = gltf.scene;
    // 坐标矫正：Blender X=高/Z=宽/Y=前 → glTF 后为 (高→X, 宽→Y, 前→-Z)，
    // 先绕 Z 转 90° 让高朝上，再绕 Y 转 180° 让前脸朝相机
    model.rotation.set(0, Math.PI, Math.PI / 2);
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const k = 1.0 / Math.max(size.x, size.y, size.z);
    model.scale.setScalar(k);
    model.position.sub(center.multiplyScalar(k));
    scene.add(model);
    model.traverse(o => {
      if (!o.userData || !o.userData.explode) return;
      o.traverse(m => {   // 材质按件克隆：高亮/半透明互不串扰（外壳共享 BodyIvory）
        if (m.isMesh) m.material = Array.isArray(m.material)
          ? m.material.map(mt => mt.clone()) : m.material.clone();
      });
      const rec = { name: o.name, obj: o, base: o.position.clone(),
                    explode: new THREE.Vector3().fromArray(o.userData.explode) };
      parts.push(rec);
      byName[o.name] = rec;
    });
    // 关键零件中文标注（文字取 assembly_a_parts.json 的 label，色号按 module）
    scene.updateMatrixWorld(true);
    parts.forEach(p => {
      if (!KEY_LABELS.includes(p.name)) return;
      const meta = partsMeta[p.name] || {};
      const div = document.createElement('div');
      div.className = 'asm-label';
      div.innerHTML = '<span class="dot" style="background:' + (MOD_COLORS[meta.module] || '#8e8e93')
        + '"></span>' + escHtml(String(meta.label || p.name).split('(')[0]);
      const lo = new CSS2DObject(div);
      const c = new THREE.Box3().setFromObject(p.obj).getCenter(new THREE.Vector3());
      lo.position.copy(p.obj.worldToLocal(c));   // 挂到零件上，随爆炸一起移动
      lo.visible = false;
      p.obj.add(lo);
      p.labelObj = lo;
    });
    updateLabels();
    paint();   // 加载前若已开透视，此处补应用
  }, undefined, err => {
    view.innerHTML = '<div class="ph">GLB 加载失败：' + err + '</div>';
  });

  // 爆炸滑块 0–1：node.position = base + explode·t（爆炸向量在 GLB node extras，模型局部坐标，随父级缩放）
  const slider = root.querySelector('.asm-explode');
  slider.addEventListener('input', () => {
    const t = slider.value / 100;
    explodeT = t;
    parts.forEach(p => p.obj.position.copy(p.base).addScaledVector(p.explode, t));
    updateLabels();
  });

  // 透视 / 标注 开关
  root.querySelectorAll('.asm-mode').forEach(b => b.addEventListener('click', () => {
    const on = !b.classList.contains('active');
    b.classList.toggle('active', on);
    if (b.dataset.mode === 'xray') { xrayOn = on; paint(); }
    else { labelsOn = on; updateLabels(); }
  }));

  // 零件选择：目标高亮，其余半透明；透视模式：外壳类零件半透（选中态优先）
  const card = root.querySelector('.asm-bom');
  let selected = null;
  function paint() {
    parts.forEach(p => {
      const dimmed = selected && p.name !== selected;
      const ghost = !dimmed && xrayOn && isGhost(p.name);
      const on = !dimmed && !ghost;
      const opacity = dimmed ? 0.07 : (ghost ? 0.15 : 1);
      p.obj.traverse(m => {
        if (!m.isMesh) return;
        (Array.isArray(m.material) ? m.material : [m.material]).forEach(mt => {
          mt.transparent = !on;
          mt.opacity = opacity;
          mt.depthWrite = on;
          if (mt.color) {
            if (mt.userData.__col === undefined) mt.userData.__col = mt.color.getHex();
            mt.color.setHex(selected && p.name === selected ? 0x17a08c : mt.userData.__col);
          }
          if (mt.emissive) {
            if (selected && p.name === selected) {
              if (!mt.userData.__em) mt.userData.__em = mt.emissive.getHex();
              mt.emissive.setHex(0x0b6e63);
              mt.emissiveIntensity = 1.5;
            } else if (mt.userData.__em !== undefined) {
              mt.emissive.setHex(mt.userData.__em);
              mt.emissiveIntensity = 1;
            }
          }
        });
      });
    });
    root.querySelectorAll('.asm-part').forEach(b =>
      b.classList.toggle('active', b.dataset.part === selected));
  }
  function renderCard(name) {
    if (!name) {
      card.innerHTML = '<h3>BOM 卡</h3><div class="fn">点击右侧零件（或直接点 3D 模型）查看该零件所属模块的候选厂 / 核验 / 单价 / MOQ。</div>';
      return;
    }
    const meta = partsMeta[name] || {};
    const mod = bomModules[meta.module] || {};
    const cands = (mod.candidates || []).map(c => {
      const v = c.verification === '✅' ? '<span class="badge b-ok">✅ 已核验</span>'
        : c.verification === '待补' ? '<span class="badge b-risk">⬜ 待补采</span>'
        : '<span class="badge b-warn">⚠️ 候选未核验</span>';
      const price = c.unit_price != null ? '¥' + c.unit_price : '待询价';
      return '<div class="cand">' + v + ' <b>' + escHtml(c.name) + '</b><br>'
        + '<span class="meta">单价 ' + escHtml(price) + ' · MOQ ' + escHtml(c.moq || '—')
        + ' · ' + escHtml(c.contact || '—') + '</span></div>';
    }).join('');
    const cb = mod.cost_budget || {};
    card.innerHTML = '<h3>' + escHtml(meta.label || name)
      + ' <span class="pn" style="color:var(--faint);font-size:10px;font-family:ui-monospace,monospace">' + escHtml(name) + '</span></h3>'
      + '<div class="fn">' + escHtml(meta.module || '') + ' ' + escHtml(mod.name || '') + ' —— ' + escHtml(mod.function || '') + '</div>'
      + cands
      + '<div class="budget">模块成本预算 ¥' + escHtml(cb.amount != null ? cb.amount : '—') + '（' + escHtml(cb.basis || '') + '）</div>';
  }
  function select(name) { selected = name; paint(); renderCard(name); }
  root.querySelectorAll('.asm-part').forEach(b =>
    b.addEventListener('click', () => select(b.dataset.part === selected ? null : b.dataset.part)));
  // 3D 里直接点零件（raycast 到带 explode extras 的节点；拖拽旋转不触发）
  const ray = new THREE.Raycaster();
  let downAt = null;
  renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
    const r = renderer.domElement.getBoundingClientRect();
    ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1,
                                        -((e.clientY - r.top) / r.height) * 2 + 1), camera);
    const hit = ray.intersectObjects(parts.map(p => p.obj), true)[0];
    if (!hit) { select(null); return; }
    let o = hit.object;
    while (o && !(o.userData && o.userData.explode)) o = o.parent;
    select(o && byName[o.name] && o.name !== selected ? o.name : null);
  });
  renderCard(null);
  // 形态切换时外部调用：重置爆炸滑块与选中态（透视/标注开关保持）
  root.__asmReset = () => {
    slider.value = 0;
    explodeT = 0;
    parts.forEach(p => p.obj.position.copy(p.base));
    updateLabels();
    select(null);
  };
  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  })();
}
window.__initAsm = () => document.querySelectorAll('.asm').forEach(initAssembly);
if (document.querySelector('#pane-supply.active')) window.__initAsm();

// ④ 三形态装配体切换：显隐对应块；离场块重置滑块/选中态；入场块懒加载 GLB
document.querySelectorAll('.asm-multi').forEach(wrap => {
  wrap.querySelectorAll('.asm-form-btn').forEach(btn => btn.addEventListener('click', () => {
    wrap.querySelectorAll('.asm-form-btn').forEach(b => b.classList.toggle('active', b === btn));
    wrap.querySelectorAll('.asm-form').forEach(f => {
      const show = f.dataset.form === btn.dataset.form;
      if (!show) {
        const r = f.querySelector('.asm');
        if (r && r.__asmReset) r.__asmReset();
      }
      f.hidden = !show;
    });
    const t = wrap.querySelector('.asm-form[data-form="' + btn.dataset.form + '"] .asm');
    if (t) initAssembly(t);
  }));
});
</script>
</body>
</html>
