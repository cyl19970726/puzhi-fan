let partNodes = [];   // { node, base, meta }
let savedMats = new Map(); // node.uuid -> [{mesh, material}]

function findMeta(nodeName) {
  const b = baseOf(nodeName);
  if (partsData[b]) return { base:b, meta:partsData[b] };
  for (const k of Object.keys(partsData)) {
    if (k.startsWith('_')) continue;
    if (nodeName.startsWith(k)) return { base:k, meta:partsData[k] };
  }
  return null;
}

function collectParts(root) {
  const seen = new Set();
  root.traverse(n => {
    if (!n.isMesh) return;
    const hit = findMeta(n.name);
    const node = hit ? (n.parent && n.parent.name === n.name ? n.parent : n) : null;
    if (hit && !seen.has(hit.base)) {
      seen.add(hit.base);
      partNodes.push({ node: n, base: hit.base, meta: hit.meta });
    }
  });
}

function setHighlight(target, on) {
  const nodes = partNodes.filter(p => p.base === target.base);
  for (const p of nodes) {
    p.node.traverse(m => {
      if (!m.isMesh) return;
      if (on) {
        if (!savedMats.has(p.node.uuid)) savedMats.set(p.node.uuid, []);
        savedMats.get(p.node.uuid).push({ mesh: m, material: m.material });
        const mat = m.material.clone();
        mat.emissive = new THREE.Color(0x16a085);
        mat.emissiveIntensity = 0.35;
        m.material = mat;
      } else if (savedMats.has(p.node.uuid)) {
        for (const s of savedMats.get(p.node.uuid)) s.mesh.material = s.material;
        savedMats.delete(p.node.uuid);
      }
    });
  }
}

// ---------- UI ----------
const listwrap = document.getElementById('listwrap');
const dTitle = document.getElementById('d-title');
const dBody = document.getElementById('d-body');

const BCLS = { verified:'b-verified', candidate:'b-candidate', 'to-source':'b-to-source' };

function select(part) {
  dash.selected = part.base;
  if (dash.__last) setHighlight(dash.__last, false);
  if (!part.internal) {
    setHighlight(part, true);
    dash.__last = part;
  } else {
    dash.__last = null;
  }
  document.querySelectorAll('.part').forEach(el =>
    el.classList.toggle('active', el.dataset.base === part.base));
  const m = part.meta;
  dTitle.textContent = m.label + '（' + part.base + '）';
  dBody.innerHTML = `
    <div class="row"><b>工艺</b>${m.process}</div>
    <div class="row"><b>厂商</b>${m.factory}</div>
    <div class="row"><b>联系</b>${m.contact}</div>
    <div class="row"><b>单价</b>${m.price}　<b>MOQ</b>${m.moq}</div>
    <div class="row"><b>状态</b><span class="badge ${BCLS[m.status]||''}">${BADGE[m.status]||m.status}</span></div>
    ${m.link ? `<div class="row"><a href="${m.link}" target="_blank">打开 1688 店铺/商品 →</a></div>` : ''}`;
}

function renderList() {
  listwrap.innerHTML = '';
  const modelBases = new Set(partNodes.map(p => p.base));
  const all = [...partNodes];
  // 内部件：parts.json 有标注但模型无网格（TEC/电池/PCB/摇头/彩盒/ODM）
  for (const [k, m] of Object.entries(partsData)) {
    if (k.startsWith('_')) continue;
    if (!modelBases.has(k)) all.push({ base: k, meta: m, internal: true });
  }
  all.forEach(p => {
    const el = document.createElement('div');
    el.className = 'part';
    el.dataset.base = p.base;
    el.innerHTML = `<div class="t">${p.meta.label}${p.internal ? ' <span style="color:#9ca3af;font-size:11px">(内部件)</span>' : ''}<span class="badge ${BCLS[p.meta.status]||''}">${BADGE[p.meta.status]||p.meta.status}</span></div>
      <div class="p">${p.meta.process}</div>
      <div class="f"><b>${p.meta.factory}</b> · ${p.meta.price}</div>`;
    el.addEventListener('click', () => select(p));
    listwrap.appendChild(el);
  });
  dash.partCount = all.length;
}

// ---------- 交互 ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  pointer.x = (e.clientX / renderer.domElement.clientWidth) * 2 - 1;
  pointer.y = -(e.clientY / renderer.domElement.clientHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(partNodes.map(p => p.node), true);
  if (hits.length) {
    let obj = hits[0].object, chain = [];
    while (obj && chain.length < 6) { chain.push(obj.name); obj = obj.parent; }
    for (const name of chain) {
      const p = partNodes.find(x => name === x.node.name || findMeta(name)?.base === x.base);
      if (p) { select(p); return; }
    }
  }
});
window.addEventListener('resize', () => {
  camera.aspect = wrap.clientWidth / wrap.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
});
function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
animate();
